name: Build fork image (GHCR)

# Builds this fork's image on GitHub (free for public repos) so MINIBOY
# only pulls it and never builds. Image: ghcr.io/jonyb21/more-like-this:places

on:
  push:
    branches:
      - claude/project-thread-gi0kfm
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Tests
        run: npm ci && npm test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jonyb21/more-like-this:places
            ghcr.io/jonyb21/more-like-this:places-${{ github.sha }}
